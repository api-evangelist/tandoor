        name: foods_or
        schema:
          type: array
          items:
            type: integer
        description: Food IDs, repeat for multiple. Return recipes with any of the foods
      - in: query
        name: foods_or_not
        schema:
          type: array
          items:
            type: integer
        description: Food IDs, repeat for multiple. Exclude recipes with any of the foods.
