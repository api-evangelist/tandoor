api_metering:
  metered: false
  detail: >-
    No plan attaches an API request quota, rate tier or overage price. The only metered resource is
    AI credits, consumed by the AI import and property-extraction features
    (POST /api/ai-import/, POST /api/recipe/{id}/aiproperties/, POST /api/ai-step-sort/) and readable
    through /api/ai-log/. On self-hosted instances AI spend is capped by the operator instead
    (default ~1 USD per space per month, AI_RATELIMIT default 60/hour).
billing:
  processor: Stripe
  evidence: >-
    /api/enterprise-billing-stripe/, /api/enterprise-billing-invoice/, /api/enterprise-billing-plan/,
    /api/enterprise-billing-product/ and StripeCheckoutSessionRequest / StripePortal schemas in the
    OpenAPI. These endpoints back the hosted product's own subscription UI.
  self_serve: true
  contact_sales_only: false
terms: https://tandoor.dev/terms/
