        schema:
          type: array
          items:
            type: integer
        description: Keyword IDs, repeat for multiple. Return recipes with any of the keywords
      - in: query
        name: keywords_or_not
        schema:
          type: array
          items:
            type: integer
        description: Keyword IDs, repeat for multiple. Exclude recipes with any of the keywords.
      - in: query
        name: makenow
        schema:
          type: boolean
        description: Filter recipes that can be made with OnHand food. [true/<b>false</b>]
      - in: query
        name: new
        schema:
          type: boolean
