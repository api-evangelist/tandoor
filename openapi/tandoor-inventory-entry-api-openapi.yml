      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this inventory entry.
        required: true
      tags:
      - Inventory Entry
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryEntry'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InventoryEntry'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InventoryEntry'
        required: true
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryEntry'
          description: ''
      summary: Api inventory entry update
      x-summary-source: derived
    patch:
      operationId: apiInventoryEntryPartialUpdate
