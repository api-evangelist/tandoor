openapi: 3.2.0
info:
  title: Tandoor Open Data Conversion API
  version: 0.0.0 (2.6.13)
  x-logo:
    url: /static/assets/brand_logo.svg
    backgroundColor: '#FFFFFF'
    altText: Tandoor logo
    href: /
  description: Tandoor API Docs
tags:
- name: Open Data Conversion
paths:
  /api/open-data-conversion/:
    get:
      operationId: apiOpenDataConversionList
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Open Data Conversion
      security:
      - ApiKeyAuth: []
