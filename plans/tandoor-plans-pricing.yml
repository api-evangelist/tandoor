summary: >-
  Tandoor sells a hosted subscription in four public tiers plus a free tier, and gives the software
  away for unlimited self-hosting. Limits are on MEMBERS, RECIPES, AI CREDITS and UPLOAD STORAGE —
  there is no API-call quota on any plan, and no plan mentions the API at all. The self-hosted build
  is the same code with the same API and no limits; the paid plans are explicitly framed as a way to
  fund development.
