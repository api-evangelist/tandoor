components:
  schemas:
    AlignmentEnum:
      enum:
      - start
      - center
      - end
      type: string
      description: '* `start` - start

        * `center` - center

        * `end` - end'
    ShoppingListEntryBulkCreate:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ShoppingListEntrySimpleCreate'
        shopping_lists_ids:
          type: array
          items:
            type: integer
      required:
      - entries
    RecipeBookEntry:
      type: object
      properties:
        id:
          type: integer
          readOnly: false
        book:
          type: integer
        book_content:
          allOf:
          - $ref: '#/components/schemas/RecipeBook'
          readOnly: true
        recipe:
          type: integer
        recipe_content:
          allOf:
          - $ref: '#/components/schemas/RecipeOverview'
          readOnly: true
      required:
      - book
      - book_content
      - recipe
      - recipe_content
    RecipeImage:
      type: object
      description: Adds nested create feature
      properties:
        image:
          type:
          - string
          - 'null'
          format: uri
        image_url:
          type:
          - string
          - 'null'
          maxLength: 4096
    OpenDataVersion:
      type: object
      description: "Moves `UniqueValidator`'s from the validation stage to the save stage.\nIt solves the problem with nested validation for unique fields on update.\n\nIf you want more details, you can read related issues and articles:\nhttps://github.com/beda-software/drf-writable-nested/issues/1\nhttp://www.django-rest-framework.org/api-guide/validators/#updating-nested-serializers\n\nExample of usage:\n```\n    class Child(models.Model):\n    field = models.CharField(unique=True)\n\n\nclass Parent(models.Model):\n    child = models.ForeignKey('Child')\n\n\nclass ChildSerializer(UniqueFieldsMixin, serializers.ModelSerializer):\n    class Meta:\n        model = Child\n\n\nclass ParentSerializer(NestedUpdateMixin, serializers.ModelSerializer):\n    child = ChildSerializer()\n\n    class Meta:\n        model = Parent\n```\n\nNote: `UniqueFieldsMixin` must be applied only on the serializer\nwhich has unique fields.\n\nNote: When you are using both mixins\n(`UniqueFieldsMixin` and `NestedCreateMixin` or `NestedUpdateMixin`)\nyou should put `UniqueFieldsMixin` ahead."
      properties:
        id:
          type: integer
          readOnly: false
        name:
          type: string
          maxLength: 128
        code:
          type: string
          maxLength: 16
        comment:
          type: string
      required:
      - code
      - name
    KeywordLabel:
      type: object
      properties:
        id:
          type: integer
          readOnly: false
        label:
          type: string
          readOnly: true
      required:
      - label
    SourceImportFood:
      type: object
      properties:
        name:
          type: string
      required:
      - name
    PatchedUser:
      type: object
      description: Adds nested create feature
      properties:
        id:
          type: integer
          readOnly: false
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_ only.
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        display_name:
          type: string
          readOnly: true
        is_staff:
          type: boolean
          readOnly: true
          title: Staff status
          description: Designates whether the user can log into this admin site.
        is_superuser:
          type: boolean
          readOnly: true
          title: Superuser status
          description: Designates that this user has all permissions without explicitly assigning them.
        is_active:
          type: boolean
          readOnly: true
          title: Active
          description: Designates whether this user should be treated as active. Unselect this instead of deleting accounts.
    PatchedEnterpriseSocialEmbed:
      type: object
      description: Adds nested create feature
      properties:
        id:
          type: integer
          readOnly: false
        name:
          type: string
          maxLength: 128
        type:
          $ref: '#/components/schemas/EnterpriseSocialEmbedTypeEnum'
        keywords:
          type: array
          items:
            $ref: '#/components/schemas/Keyword'
        alignment:
          $ref: '#/components/schemas/AlignmentEnum'
        background_color:
          type:
          - string
          - 'null'
          maxLength: 32
        accent_color:
          type:
          - string
          - 'null'
          maxLength: 32
        uuid:
          type: string
          format: uuid
    PaginatedUnitList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Unit'
        timestamp:
          type: string
          format: date-time
    AccessToken:
      type: object
      properties:
        id:
          type: integer
          readOnly: false
        token:
          type: string
          readOnly: true
        expires:
          type: string
          format: date-time
        scope:
          type: string
        created:
          type: string
          format: date-time
          readOnly: true
        updated:
          type: string
          format: date-time
          readOnly: true
      required:
