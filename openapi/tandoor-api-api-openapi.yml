            type: string
            enum:
            - DESCRIPTION_REPLACE
            - FOOD_ALIAS
            - FOOD_REPLACE
            - INSTRUCTION_REPLACE
            - KEYWORD_ALIAS
            - NAME_REPLACE
            - NEVER_UNIT
