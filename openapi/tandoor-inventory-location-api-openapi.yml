openapi: 3.2.0
info:
  title: Tandoor Inventory Location API
  version: 0.0.0 (2.6.13)
  x-logo:
    url: /static/assets/brand_logo.svg
    backgroundColor: '#FFFFFF'
    altText: Tandoor logo
    href: /
  description: Tandoor API Docs
tags:
- name: Inventory Location
paths:
  /api/inventory-location/:
    get:
      operationId: apiInventoryLocationList
      description: logs request counts to redis cache total/per user/
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Inventory Location
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInventoryLocationList'
          description: ''
      summary: Api inventory location list
      x-summary-source: derived
    post:
      operationId: apiInventoryLocationCreate
      description: logs request counts to redis cache total/per user/
      tags:
      - Inventory Location
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryLocation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InventoryLocation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InventoryLocation'
        required: true
      security:
      - ApiKeyAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryLocation'
          description: ''
      summary: Api inventory location create
      x-summary-source: derived
  /api/inventory-location/{id}/:
    get:
      operationId: apiInventoryLocationRetrieve
      description: logs request counts to redis cache total/per user/
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this inventory location.
        required: true
      tags:
      - Inventory Location
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryLocation'
          description: ''
      summary: Api inventory location retrieve
      x-summary-source: derived
    put:
      operationId: apiInventoryLocationUpdate
      description: logs request counts to redis cache total/per user/
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this inventory location.
        required: true
      tags:
      - Inventory Location
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryLocation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InventoryLocation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InventoryLocation'
        required: true
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryLocation'
          description: ''
      summary: Api inventory location update
      x-summary-source: derived
    patch:
      operationId: apiInventoryLocationPartialUpdate
      description: logs request counts to redis cache total/per user/
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this inventory location.
        required: true
      tags:
      - Inventory Location
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedInventoryLocation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedInventoryLocation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedInventoryLocation'
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryLocation'
          description: ''
      summary: Api inventory location partial update
      x-summary-source: derived
    delete:
      operationId: apiInventoryLocationDestroy
      description: logs request counts to redis cache total/per user/
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this inventory location.
        required: true
      tags:
      - Inventory Location
      security:
      - ApiKeyAuth: []
      responses:
        '204':
          description: No response body
      summary: Api inventory location destroy
      x-summary-source: derived
  /api/inventory-location/{id}/cascading/:
    get:
      operationId: apiInventoryLocationCascadingList
      description: get a paginated list of objects that will be cascaded (deleted) when deleting the selected object
      parameters:
      - in: query
        name: cache
        schema:
          type: boolean
          default: true
        description: If results can be cached or not
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this inventory location.
        required: true
      - name: page
        required: false
