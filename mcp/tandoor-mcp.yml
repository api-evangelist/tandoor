    source_operation: openapi/tandoor-api-openapi.yml#apiExportCreate
tool_crosswalk:
  applicable: false
  reason: >-
    A crosswalk binds a real MCP tool set to backing REST operations. Tandoor has no MCP server and no
    GraphQL endpoint, so there is nothing to bind — the list above IS the REST surface, restated. A
    crosswalk here would be a self-referential file with no divergence to record.
