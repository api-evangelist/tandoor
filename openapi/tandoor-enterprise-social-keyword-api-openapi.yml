        description: A unique integer value identifying this keyword.
        required: true
      tags:
      - Enterprise Social Keyword
      security:
      - ApiKeyAuth: []
      responses:
        '204':
          description: No response body
      summary: Api enterprise social keyword destroy
      x-summary-source: derived
