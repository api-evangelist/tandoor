method: derived
status: candidate
source: openapi/tandoor-api-openapi.yml
checked: '2026-08-27'
summary: >-
  Tandoor ships NO Model Context Protocol server — not hosted, not stdio, not in the GitHub
  organization, not on npm or PyPI. This file records that absence plus a DERIVED candidate tool list
  built from the published OpenAPI operations. No `MCPServer` pointer is emitted in apis.yml and none
  should be added by a later round: the pointer asserts an agent surface this provider does not serve.
  The gap is conspicuous, because at least eleven independent developers have built one — a Tandoor
  MCP server is the most-forked unmet ask in this profile.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: api-key
  verified: searched
  auth_note: >-
    Any future server would authenticate the same way the API does — an access token in the
    Authorization header, minted at /api/access-token/ or POST /api-token-auth/ — and would need the
    instance base URL as configuration, because Tandoor is self-hosted first.
searched:
  github_org:
    url: https://github.com/TandoorRecipes
    repos: [recipes, open-tandoor-data, open_data_plugin, vue-simple-calendar]
    result: no MCP repository
  registries:
    npm: no package under a Tandoor-owned name
    pypi: no package under a Tandoor-owned name
  docs:
    url: https://docs.tandoor.dev/
    result: MCP is not mentioned anywhere in the 361-document search index
community_servers:
  note: >-
    Recorded as market evidence only. None is published, endorsed or maintained by Tandoor, and none
    is wired into apis.yml.
  observed: 11
  examples:
    - repo: starbuck93/tandoor-mcp-server
      stars: 15
      last_push: '2025-03-29'
    - repo: ChristopherJMiller/tandoor-mcp
      stars: 5
      last_push: '2026-01-26'
    - repo: mc-mario/tandoor-mcp
      stars: 3
      last_push: '2026-08-02'
    - repo: compilercomplied/tandoor-mcp
      stars: 0
      last_push: '2026-08-20'
    - repo: Hugeldugelking/tandoor-mcp
      stars: 0
      last_push: '2026-08-03'
    - repo: oculairmedia/Tandoor.mcp
      stars: 1
      last_push: '2026-04-19'
  observation: >-
    Every one of these wraps the same public REST API against a user-supplied instance URL and token.
    The demand is real and the contract to build against is already published; what is missing is a
    first-party server.
transport_note: >-
  A hosted (remote) server is only meaningful for app.tandoor.dev. For self-hosted instances the
  natural shape is local-stdio with TANDOOR_URL + TANDOOR_TOKEN, or an MCP endpoint mounted inside
  the Django app itself.
tools_note: >-
  Candidate tools derived one-to-one from real operationIds in the published contract. Each carries
  its backing operation so an implementer inherits the real parameters and request body. These are
  proposals, not a manifest of anything that exists.
