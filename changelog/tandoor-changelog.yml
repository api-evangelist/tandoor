  (**added** / **improved** / **fixed** / **updated**), links each security fix to its GHSA advisory,
  and flags breaking operator actions with a ⚠️ marker. There is no separate changelog page, no RSS
  feed of API changes, and no distinction drawn between API-affecting and UI-only changes.
