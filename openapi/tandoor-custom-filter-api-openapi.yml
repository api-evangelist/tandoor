openapi: 3.2.0
info:
  title: Tandoor Custom Filter API
  version: 0.0.0 (2.6.13)
  x-logo:
    url: /static/assets/brand_logo.svg
    backgroundColor: '#FFFFFF'
    altText: Tandoor logo
    href: /
  description: Tandoor API Docs
tags:
- name: Custom Filter
paths:
  /api/custom-filter/:
    get:
      operationId: apiCustomFilterList
      description: logs request counts to redis cache total/per user/
      parameters:
      - in: query
        name: limit
        schema:
          type: string
        description: limit number of entries to return
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: query
        schema:
          type: string
        description: lookup if query string is contained within the name, case insensitive
      - in: query
        name: random
        schema:
          type: string
        description: randomly orders entries (only works together with limit)
      - in: query
        name: type
        schema:
          type: array
          items:
            type: string
            enum:
            - FOOD
            - KEYWORD
            - RECIPE
        description: Return the CustomFilters matching the model type.  Repeat for multiple.
      - in: query
        name: updated_at
        schema:
          type: string
        description: if model has an updated_at timestamp, filter only models updated at or after datetime
        examples:
          DateFormat:
            value: '1972-12-05'
            summary: Date Format
      tags:
      - Custom Filter
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCustomFilterList'
          description: ''
      summary: Api custom filter list
      x-summary-source: derived
    post:
      operationId: apiCustomFilterCreate
      description: logs request counts to redis cache total/per user/
      tags:
      - Custom Filter
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomFilter'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomFilter'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomFilter'
        required: true
      security:
      - ApiKeyAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFilter'
          description: ''
      summary: Api custom filter create
      x-summary-source: derived
  /api/custom-filter/{id}/:
    get:
      operationId: apiCustomFilterRetrieve
      description: logs request counts to redis cache total/per user/
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this custom filter.
        required: true
      tags:
      - Custom Filter
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFilter'
          description: ''
      summary: Api custom filter retrieve
      x-summary-source: derived
    put:
      operationId: apiCustomFilterUpdate
      description: logs request counts to redis cache total/per user/
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this custom filter.
        required: true
      tags:
      - Custom Filter
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomFilter'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomFilter'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomFilter'
        required: true
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFilter'
          description: ''
      summary: Api custom filter update
      x-summary-source: derived
    patch:
      operationId: apiCustomFilterPartialUpdate
      description: logs request counts to redis cache total/per user/
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this custom filter.
        required: true
      tags:
      - Custom Filter
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCustomFilter'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCustomFilter'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCustomFilter'
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFilter'
          description: ''
      summary: Api custom filter partial update
      x-summary-source: derived
    delete:
      operationId: apiCustomFilterDestroy
      description: logs request counts to redis cache total/per user/
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this custom filter.
        required: true
      tags:
      - Custom Filter
      security:
      - ApiKeyAuth: []
      responses:
        '204':
          description: No response body
      summary: Api custom filter destroy
      x-summary-source: derived
components:
  schemas:
    CustomFilter:
      type: object
      description: Adds nested create feature
      properties:
        id:
          type: integer
          readOnly: false
        name:
          type: string
          maxLength: 128
        search:
          type: string
        shared:
          type: array
          items:
            $ref: '#/components/schemas/User'
        created_by:
          type: integer
          readOnly: true
      required:
      - created_by
      - name
      - search
    PaginatedCustomFilterList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/CustomFilter'
        timestamp:
          type: string
          format: date-time
    PatchedCustomFilter:
      type: object
      description: Adds nested create feature
      properties:
        id:
          type: integer
          readOnly: false
        name:
          type: string
          maxLength: 128
        search:
          type: string
        shared:
          type: array
          items:
            $ref: '#/components/schemas/User'
        created_by:
          type: integer
          readOnly: true
    User:
      type: object
      description: Adds nested create feature
      properties:
        id:
          type: integer
          readOnly: false
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_ only.
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        display_name:
          type: string
          readOnly: true
        is_staff:
          type: boolean
          readOnly: true
          title: Staff status
          description: Designates whether the user can log into this admin site.
        is_superuser:
          type: boolean
          readOnly: true
          title: Superuser status
          description: Designates that this user has all permissions without explicitly assigning them.
        is_active:
          type: boolean
          readOnly: true
          title: Active
          description: Designates whether this user should be treated as active. Unselect this instead of deleting accounts.
      required:
      - display_name
      - is_active
      - is_staff
      - is_superuser
      - username
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
