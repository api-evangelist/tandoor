openapi: 3.2.0
info:
  title: Tandoor Ai Step Sort API
  version: 0.0.0 (2.6.13)
  x-logo:
    url: /static/assets/brand_logo.svg
    backgroundColor: '#FFFFFF'
    altText: Tandoor logo
    href: /
  description: Tandoor API Docs
tags:
- name: Ai Step Sort
paths:
  /api/ai-step-sort/:
    post:
      operationId: apiAiStepSortCreate
      description: given an image or PDF file convert its content to a structured recipe using AI and the scraping system
      parameters:
      - in: query
        name: provider
        schema:
          type: integer
        description: ID of the AI provider that should be used for this AI request
      tags:
      - Ai Step Sort
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Recipe'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Recipe'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Recipe'
        required: true
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
          description: ''
      summary: Api ai step sort create
      x-summary-source: derived
