aid: tandoor
name: Tandoor Recipes
description: >-
  Tandoor Recipes is an open-source, self-hostable recipe management, meal planning and shopping-list
  application built on Django and django-rest-framework, developed in Falkensee, Germany and offered
  both as freely self-hosted software (Docker, Kubernetes, Unraid, Synology, TrueNAS) and as a paid
  hosted service at app.tandoor.dev. Every feature of the product is driven by one REST API — recipes,
  steps, ingredients, foods, units, unit conversions, properties and nutrition, keywords, meal plans,
  meal types, shopping lists and shopping-list entries, supermarkets and supermarket category
  ordering, pantry inventory, recipe books, cook/view logs, spaces and households, user preferences,
  invite and share links, storage backends and external recipe sync, import/export of a dozen recipe
  formats, URL/image/PDF recipe scraping, an AI import and property-extraction pipeline routed through
  LiteLLM, and the Open Data food/unit/store reference database. The API is described by a live
  drf-spectacular OpenAPI 3.0.3 document served without authentication at /openapi/ on every instance,
  covering 244 paths and 462 operations across 244 component schemas, and it is the same contract the
  official Vue 3 frontend is generated against.
