          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ShoppingListEntry'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ShoppingListEntry'
        required: true
      security:
      - ApiKeyAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingListEntry'
          description: ''
      summary: Api shopping list entry create
      x-summary-source: derived
